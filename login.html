<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer & Admin Login - MGM DABHA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header-main">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo-group">
                <div class="logo-icon"><i class="fas fa-utensils"></i></div>
                <div class="logo-text">
                    <h1>MGM DABHA</h1>
                    <span>Authentic Taste | உண்மையான சுவை</span>
                </div>
            </a>
        </div>
    </header>

    <section class="section-padding" style="display:flex; align-items:center; min-height:80vh;">
        <div class="container" style="max-width:440px;">
            <div style="background:var(--card-bg); padding:40px; border-radius:var(--radius); border:1px solid var(--border-color); box-shadow:var(--shadow);">
                <div class="text-center" style="margin-bottom:25px;">
                    <h2 style="font-size:1.8rem; font-weight:700; color:var(--primary);">Welcome Back</h2>
                    <p style="font-size:0.9rem; color:var(--text-muted);">Login to access your orders & profile</p>
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" class="form-control" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;"><i class="fas fa-sign-in-alt"></i> Login</button>
                </form>

                <div style="margin-top:20px; padding-top:15px; border-top:1px dashed var(--border-color); font-size:0.8rem; color:gray;">
                    <strong>Demo Credentials:</strong><br>
                    Customer: <code>rajesh@gmail.com</code> / <code>user123</code><br>
                    Admin: <code>admin@mgmdabha.com</code> / <code>admin123</code>
                </div>

                <div class="text-center" style="margin-top:20px; font-size:0.9rem;">
                    Don't have an account? <a href="signup.html" style="color:var(--secondary); font-weight:600;">Sign up free</a>
                </div>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('mgm_user', JSON.stringify(data.user));
                    showToast(`Welcome back, ${data.user.name}!`, 'success');
                    setTimeout(() => {
                        if (data.user.role === 'admin') {
                            window.location.href = 'admin/dashboard.html';
                        } else {
                            window.location.href = 'profile.html';
                        }
                    }, 1000);
                } else {
                    showToast(data.message || 'Invalid credentials', 'error');
                }
            } catch (err) {
                showToast('Server error during login', 'error');
            }
        }
    </script>
</body>
</html>
