version: '3.8'

services:
  app:
    build: .
    container_name: mgm_dabha_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=mgm_user
      - DB_PASSWORD=mgm_password
      - DB_NAME=mgm_dabha
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: mgm_dabha_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mgm_dabha
      MYSQL_USER: mgm_user
      MYSQL_PASSWORD: mgm_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always

volumes:
  db_data:
