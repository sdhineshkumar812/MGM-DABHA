<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Partner Login - MGM DABHA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #3A0000 0%, #7A0000 50%, #B30000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #2c3e50;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 35px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            position: relative;
        }

        .brand-logo-icon {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #FF6B00, #D35400);
            color: #FFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 15px;
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.4);
        }

        .login-title { font-size: 1.6rem; font-weight: 800; color: #8B0000; margin-bottom: 4px; }
        .login-subtitle { font-size: 0.85rem; color: #666; margin-bottom: 28px; font-weight: 500; }

        .form-group { text-align: left; margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 8px; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 16px; color: #FF6B00; font-size: 1.1rem; }

        .form-control {
            width: 100%;
            padding: 13px 16px 13px 48px;
            border-radius: 12px;
            border: 1.5px solid #E2E8F0;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
            background: #F8FAFC;
        }

        .form-control:focus {
            border-color: #FF6B00;
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.12);
            background: #FFF;
        }

        .toggle-password { position: absolute; right: 16px; color: #888; cursor: pointer; font-size: 1rem; }

        .form-options { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; margin-bottom: 25px; }
        .remember-me { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #555; }
        .forgot-link { color: #8B0000; font-weight: 600; text-decoration: none; }
        .forgot-link:hover { text-decoration: underline; }

        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            background: linear-gradient(135deg, #FF6B00, #D35400);
            color: #FFF;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.35);
            transition: all 0.25 ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 107, 0, 0.45); }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            color: #666;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-back:hover { color: #8B0000; }

        /* Error/Success Toast */
        #login-toast {
            position: fixed;
            top: 25px;
            right: 25px;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            color: #FFF;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            animation: slideDown 0.3s ease;
        }
        #login-toast.success { background: #2ECC71; }
        #login-toast.error { background: #E74C3C; }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div id="login-toast" class="success">
        <i id="toast-icon" class="fas fa-check-circle"></i>
        <span id="toast-msg">Login Successful!</span>
    </div>

    <div class="login-card">
        <div class="brand-logo-icon"><i class="fas fa-motorcycle"></i></div>
        <h1 class="login-title">Delivery Personnel Login</h1>
        <p class="login-subtitle"><i class="fas fa-bolt" style="color:#FF6B00;"></i> Fast • Safe • On Time Delivery</p>

        <form id="delivery-login-form">
            <div class="form-group">
                <label>Mobile Number</label>
                <div class="input-wrapper">
                    <i class="fas fa-mobile-alt input-icon"></i>
                    <input type="tel" id="mobile-input" class="form-control" placeholder="10-digit mobile number" maxlength="10" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password-input" class="form-control" placeholder="Enter password" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember-me"> Remember Me
                </label>
                <a href="#" onclick="alert('Please contact restaurant admin to reset delivery password.');" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" id="login-btn" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Login to Dashboard
            </button>
        </form>

        <a href="../index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Customer Website</a>
    </div>

    <script src="login.js"></script>
</body>
</html>
