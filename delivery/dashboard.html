<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Partner Dashboard - MGM DABHA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #8B0000;
            --secondary: #FF6B00;
            --accent: #FFC107;
            --bg-main: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-dark: #2C3E50;
            --border-color: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-dark); min-height: 100vh; padding-bottom: 50px; }

        .header-bar {
            background: linear-gradient(135deg, #4B0000, var(--primary));
            color: #FFF;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .rider-profile-box { display: flex; align-items: center; gap: 15px; }
        .rider-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--secondary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #FFF; font-weight: 700; border: 2px solid #FFF; }
        
        .status-toggle-box { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 30px; backdrop-filter: blur(5px); }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 22px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border-color); display: flex; align-items: center; gap: 18px; }
        .stat-icon { width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #FFF; }

        .order-card { background: var(--card-bg); border-radius: 16px; padding: 22px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .order-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 15px; }

        .btn-action { padding: 8px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease; text-decoration: none; }
        .btn-accept { background: #2ECC71; color: #FFF; }
        .btn-dispatch { background: var(--secondary); color: #FFF; }
        .btn-call { background: #3498DB; color: #FFF; }
        .btn-nav { background: #9B59B6; color: #FFF; }

        .status-timeline { display: flex; justify-content: space-between; position: relative; margin: 25px 0 15px; }
        .status-step { display: flex; flex-direction: column; align-items: center; font-size: 0.78rem; font-weight: 600; color: #888; position: relative; z-index: 2; }
        .status-step.active { color: var(--secondary); font-weight: 700; }
        .status-dot { width: 22px; height: 22px; border-radius: 50%; background: #E2E8F0; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; font-size: 0.7rem; color: #FFF; }
        .status-step.active .status-dot { background: var(--secondary); }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <header class="header-bar">
        <div class="rider-profile-box">
            <div class="rider-avatar" id="rider-initial">D</div>
            <div>
                <h3 id="rider-name" style="font-size:1.1rem; margin:0;">Dhinesh Kumar</h3>
                <span id="rider-info" style="font-size:0.8rem; opacity:0.85;">Vehicle: TN29AB1234 • Phone: 9876543210</span>
            </div>
        </div>

        <div style="display:flex; align-items:center; gap:15px;">
            <div class="status-toggle-box">
                <span style="font-size:0.85rem; font-weight:600;">Status:</span>
                <button id="toggle-online-btn" onclick="toggleOnlineStatus()" style="background:#2ECC71; color:#FFF; border:none; padding:4px 14px; border-radius:15px; font-weight:700; cursor:pointer;">🟢 Online</button>
            </div>
            <button onclick="logoutRider()" style="background:rgba(255,255,255,0.2); color:#FFF; border:none; padding:8px 14px; border-radius:12px; cursor:pointer; font-weight:600;"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- Metric Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background:#3498DB;"><i class="fas fa-shopping-bag"></i></div>
                <div>
                    <h3 id="stat-assigned">2</h3>
                    <p style="font-size:0.85rem; color:#666;">Assigned Orders</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#2ECC71;"><i class="fas fa-check-circle"></i></div>
                <div>
                    <h3 id="stat-completed">8</h3>
                    <p style="font-size:0.85rem; color:#666;">Delivered Today</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:var(--secondary);"><i class="fas fa-rupee-sign"></i></div>
                <div>
                    <h3 id="stat-earnings">₹680.00</h3>
                    <p style="font-size:0.85rem; color:#666;">Today's Earnings</p>
                </div>
            </div>
        </div>

        <!-- Live Assigned Deliveries -->
        <h2 style="font-size:1.25rem; color:var(--primary); margin-bottom:20px;"><i class="fas fa-motorcycle" style="color:var(--secondary);"></i> Active Delivery Task</h2>
        <div id="assigned-orders-container"></div>

        <!-- Rider Earnings & History Chart -->
        <div style="background:var(--card-bg); padding:25px; border-radius:16px; border:1px solid var(--border-color); box-shadow:0 4px 15px rgba(0,0,0,0.05); margin-top:30px;">
            <h3 style="font-size:1.1rem; color:var(--primary); margin-bottom:15px;"><i class="fas fa-chart-bar" style="color:var(--secondary);"></i> Weekly Delivery Earnings (₹)</h3>
            <canvas id="earningsChart" height="200"></canvas>
        </div>
    </div>

    <script>
        let isOnline = true;

        document.addEventListener('DOMContentLoaded', () => {
            protectRouteAndLoadSession();
            fetchAssignedOrders();
            initEarningsChart();
        });

        function protectRouteAndLoadSession() {
            const riderData = localStorage.getItem('mgm_rider') || localStorage.getItem('mgm_delivery_staff');
            if (!riderData) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const rider = JSON.parse(riderData);
                document.getElementById('rider-name').textContent = rider.name || 'Dhinesh Kumar';
                document.getElementById('rider-initial').textContent = (rider.name || 'D').charAt(0).toUpperCase();
                document.getElementById('rider-info').textContent = `Vehicle: ${rider.vehicle_number || 'TN29AB1234'} • Phone: ${rider.phone || '9876543210'}`;
            } catch (e) {}
        }

        function toggleOnlineStatus() {
            isOnline = !isOnline;
            const btn = document.getElementById('toggle-online-btn');
            if (isOnline) {
                btn.style.background = '#2ECC71';
                btn.textContent = '🟢 Online';
            } else {
                btn.style.background = '#E74C3C';
                btn.textContent = '🔴 Offline';
            }
        }

        async function fetchAssignedOrders() {
            const container = document.getElementById('assigned-orders-container');
            try {
                const res = await fetch('/delivery/orders');
                const data = await res.json();
                if (data.success && data.orders.length > 0) {
                    container.innerHTML = data.orders.map(o => `
                        <div class="order-card">
                            <div class="order-card-header">
                                <div>
                                    <strong style="font-size:1.1rem; color:var(--primary);">Order #MGM-${o.id}</strong>
                                    <span style="font-size:0.85rem; color:gray; margin-left:10px;"><i class="fas fa-clock"></i> ${new Date(o.order_date).toLocaleTimeString()}</span>
                                </div>
                                <span style="background:rgba(255,107,0,0.15); color:var(--secondary); font-weight:700; padding:4px 12px; border-radius:15px; font-size:0.8rem;">Status: ${o.order_status}</span>
                            </div>

                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:15px; font-size:0.92rem;">
                                <div>
                                    <strong style="color:#555;">Customer Details:</strong>
                                    <div style="font-weight:700; margin-top:2px;">${o.customer_name}</div>
                                    <div style="color:gray;">Phone: ${o.customer_phone}</div>
                                </div>
                                <div>
                                    <strong style="color:#555;">Delivery Address:</strong>
                                    <div style="margin-top:2px;">${o.delivery_address}</div>
                                </div>
                            </div>

                            <!-- Live Timeline Bar -->
                            <div class="status-timeline">
                                <div class="status-step active"><div class="status-dot"><i class="fas fa-check"></i></div>Pending</div>
                                <div class="status-step ${['Accepted','Picked Up','On the Way','Delivered'].includes(o.order_status) ? 'active' : ''}"><div class="status-dot"><i class="fas fa-check"></i></div>Accepted</div>
                                <div class="status-step ${['Picked Up','On the Way','Delivered'].includes(o.order_status) ? 'active' : ''}"><div class="status-dot"><i class="fas fa-check"></i></div>Picked Up</div>
                                <div class="status-step ${['On the Way','Delivered'].includes(o.order_status) ? 'active' : ''}"><div class="status-dot"><i class="fas fa-check"></i></div>On the Way</div>
                                <div class="status-step ${o.order_status === 'Delivered' ? 'active' : ''}"><div class="status-dot"><i class="fas fa-check"></i></div>Delivered</div>
                            </div>

                            <!-- Action Buttons -->
                            <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-color); padding-top:15px; margin-top:15px;">
                                <strong style="font-size:1.1rem; color:var(--primary);">Amount: ₹${o.total_amount} (${o.payment_method})</strong>
                                <div style="display:flex; gap:10px;">
                                    <a href="tel:${o.customer_phone}" class="btn-action btn-call"><i class="fas fa-phone"></i> Call Customer</a>
                                    <a href="https://maps.google.com/?q=${encodeURIComponent(o.delivery_address)}" target="_blank" class="btn-action btn-nav"><i class="fas fa-location-arrow"></i> Google Maps</a>
                                    ${o.order_status !== 'Delivered' ? `
                                        <button onclick="updateDeliveryStatus(${o.id}, '${getNextStatus(o.order_status)}')" class="btn-action btn-dispatch"><i class="fas fa-arrow-right"></i> Mark as ${getNextStatus(o.order_status)}</button>
                                    ` : '<span style="color:#2ECC71; font-weight:700;"><i class="fas fa-check-circle"></i> Completed</span>'}
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="order-card" style="text-align:center; color:gray;"><i class="fas fa-check-circle" style="font-size:2rem; color:#2ECC71; margin-bottom:10px; display:block;"></i> No active pending deliveries assigned!</div>';
                }
            } catch (err) {}
        }

        function getNextStatus(curr) {
            if (curr === 'Pending') return 'Accepted';
            if (curr === 'Accepted') return 'Picked Up';
            if (curr === 'Picked Up') return 'On the Way';
            if (curr === 'On the Way') return 'Delivered';
            return 'Delivered';
        }

        async function updateDeliveryStatus(id, nextStatus) {
            try {
                const res = await fetch(`/delivery/status/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: nextStatus })
                });
                const data = await res.json();
                if (data.success) {
                    fetchAssignedOrders();
                }
            } catch (err) {}
        }

        function initEarningsChart() {
            const ctx = document.getElementById('earningsChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Earnings (₹)',
                        data: [450, 620, 580, 720, 890, 1120, 1250],
                        backgroundColor: '#FF6B00',
                        borderRadius: 8
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function logoutRider() {
            localStorage.removeItem('mgm_rider');
            localStorage.removeItem('mgm_delivery_token');
            localStorage.removeItem('mgm_delivery_staff');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
