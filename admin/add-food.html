<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food - MGM DABHA Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo-icon"><i class="fas fa-utensils"></i></div>
            <div class="sidebar-brand">
                <h2>MGM DABHA</h2>
                <span>ADMIN PANEL</span>
            </div>
        </div>
        <div class="sidebar-menu">
            <a href="dashboard.html" class="menu-item"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="add-food.html" class="menu-item active"><i class="fas fa-plus-circle"></i> Add Food</a>
            <a href="manage-food.html" class="menu-item"><i class="fas fa-hamburger"></i> Manage Foods</a>
            <a href="orders.html" class="menu-item"><i class="fas fa-shopping-cart"></i> Orders</a>
            <a href="reservations.html" class="menu-item"><i class="fas fa-calendar-check"></i> Reservations</a>
            <a href="users.html" class="menu-item"><i class="fas fa-users"></i> Customers</a>
            <a href="reports.html" class="menu-item"><i class="fas fa-file-invoice-dollar"></i> Reports</a>
            <a href="contact-settings.html" class="menu-item"><i class="fas fa-cog"></i> Contact Settings</a>
        </div>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <h3>Add New Food Item</h3>
        </header>

        <div class="admin-body">
            <div class="table-card" style="padding:35px; max-width:800px; margin:0 auto;">
                <form id="add-food-form" enctype="multipart/form-data" onsubmit="handleAddFood(event)">
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:20px;">
                        <div class="form-group">
                            <label>Food Item Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Chettinad Chicken Biryani" required>
                        </div>
                        <div class="form-group">
                            <label>Price (₹)</label>
                            <input type="number" step="0.01" name="price" class="form-control" placeholder="e.g. 240.00" required>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select name="category" class="form-control" required>
                                <option value="Non Veg">Non Veg</option>
                                <option value="Veg">Veg</option>
                                <option value="Chinese">Chinese</option>
                                <option value="Tandoori">Tandoori</option>
                                <option value="Juices">Juices</option>
                                <option value="Dessert">Dessert</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Discount Percentage (%)</label>
                            <input type="number" name="discount_percent" class="form-control" value="0">
                        </div>
                        <div class="form-group">
                            <label>Rating (1 to 5)</label>
                            <input type="number" step="0.1" name="rating" class="form-control" value="4.5">
                        </div>
                        <div class="form-group" style="display:flex; align-items:center; gap:20px; margin-top:25px;">
                            <label style="display:flex; align-items:center; gap:8px;">
                                <input type="checkbox" name="is_veg" value="1"> Vegetarian
                            </label>
                            <label style="display:flex; align-items:center; gap:8px;">
                                <input type="checkbox" name="is_bestseller" value="1"> Bestseller Badge
                            </label>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top:20px;">
                        <label>Description</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Food preparation details and ingredients..."></textarea>
                    </div>

                    <!-- Image Upload Preview Box -->
                    <div class="form-group">
                        <label>Food Image</label>
                        <div class="image-preview-box" onclick="document.getElementById('food-img-input').click();">
                            <img id="preview-img-tag" src="" style="display:none;">
                            <div id="preview-placeholder">
                                <i class="fas fa-cloud-upload-alt" style="font-size:2.5rem; color:var(--admin-secondary);"></i>
                                <p style="margin-top:10px; font-size:0.9rem; color:gray;">Click to upload food image (Multer File Upload)</p>
                            </div>
                        </div>
                        <input type="file" id="food-img-input" name="image" accept="image/*" style="display:none;" onchange="previewImage(this)">
                    </div>

                    <div style="margin-top:30px; text-align:right;">
                        <button type="submit" class="btn btn-primary" style="padding:12px 35px; background:var(--admin-secondary); color:#FFF; border:none; border-radius:30px; font-weight:700; cursor:pointer;"><i class="fas fa-save"></i> Save Food Item</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview-img-tag').src = e.target.result;
                    document.getElementById('preview-img-tag').style.display = 'block';
                    document.getElementById('preview-placeholder').style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function handleAddFood(e) {
            e.preventDefault();
            const formData = new FormData(e.target);

            try {
                const res = await fetch('/api/add-food', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    alert('Food Item Added Successfully!');
                    window.location.href = 'manage-food.html';
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) {
                alert('Failed to upload food item');
            }
        }
    </script>
</body>
</html>
