<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations & Calendar - MGM DABHA Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo-icon"><i class="fas fa-utensils"></i></div>
            <div class="sidebar-brand">
                <h2>MGM DABHA</h2>
                <span>ADMIN V3.0</span>
            </div>
        </div>
        <div class="sidebar-menu">
            <a href="dashboard.html" class="menu-item"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="add-food.html" class="menu-item"><i class="fas fa-plus-circle"></i> Add Food</a>
            <a href="manage-food.html" class="menu-item"><i class="fas fa-hamburger"></i> Manage Foods</a>
            <a href="inventory.html" class="menu-item"><i class="fas fa-boxes"></i> Inventory Stock</a>
            <a href="orders.html" class="menu-item"><i class="fas fa-shopping-cart"></i> Orders</a>
            <a href="reservations.html" class="menu-item active"><i class="fas fa-calendar-check"></i> Reservations</a>
            <a href="users.html" class="menu-item"><i class="fas fa-users"></i> Customers</a>
            <a href="reports.html" class="menu-item"><i class="fas fa-file-invoice-dollar"></i> Reports</a>
            <a href="contact-settings.html" class="menu-item"><i class="fas fa-cog"></i> Settings</a>
        </div>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <h3>Table Reservations & Calendar Schedule</h3>
        </header>

        <div class="admin-body">
            <div class="page-title-box">
                <h1 class="page-title">Reservations Manager</h1>
            </div>

            <div class="table-card">
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Res ID</th>
                                <th>Customer Name</th>
                                <th>Contact Info</th>
                                <th>Guests</th>
                                <th>Date & Time</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="res-tbody">
                            <tr><td colspan="7" class="text-center" style="padding:30px;">Loading reservations...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', fetchReservations);

        async function fetchReservations() {
            try {
                const res = await fetch('/api/reservations');
                const data = await res.json();
                if (data.success) {
                    renderReservations(data.reservations);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderReservations(list) {
            const tbody = document.getElementById('res-tbody');
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center" style="padding:30px;">No reservations found.</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(r => `
                <tr>
                    <td><strong>#RES-${r.id}</strong></td>
                    <td><strong>${r.customer_name}</strong></td>
                    <td style="font-size:0.85rem;">
                        <div><i class="fas fa-envelope"></i> ${r.email}</div>
                        <div><i class="fas fa-phone"></i> ${r.phone}</div>
                    </td>
                    <td><span style="font-weight:700; color:var(--admin-secondary);">${r.guests} Guests</span></td>
                    <td style="font-size:0.88rem;">${r.reservation_date} @ ${r.reservation_time}</td>
                    <td>
                        <select onchange="updateResStatus(${r.id}, this.value)" class="status-select">
                            <option value="Pending" ${r.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Confirmed" ${r.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="Completed" ${r.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            <option value="Cancelled" ${r.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    </td>
                    <td>
                        <button onclick="deleteRes(${r.id})" style="background:none; border:none; color:#e74c3c; cursor:pointer;" title="Delete Reservation"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function updateResStatus(id, newStatus) {
            try {
                const res = await fetch(`/api/reservation-status/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                if (data.success) {
                    alert(`Reservation status updated to ${newStatus}`);
                }
            } catch (err) {
                alert('Error updating reservation');
            }
        }

        async function deleteRes(id) {
            if (confirm('Delete this reservation?')) {
                try {
                    await fetch(`/api/delete-reservation/${id}`, { method: 'DELETE' });
                    fetchReservations();
                } catch (err) {
                    alert('Error deleting reservation');
                }
            }
        }
    </script>
</body>
</html>
